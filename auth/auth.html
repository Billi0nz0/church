<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="icon"  href="./Images/logo.svg">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="../Css/toast.css">
    <title>Account | GCM</title>
</head>
<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-header">
                <h1>Welcome</h1>
                <p>
                    Sign in to your account or create a new one.
                </p>
            </div>

            <div class="auth-tabs">
                <button class="tab-btn active" onclick="showForm('signin')">
                    Sign In
                </button>

                <button class="tab-btn" id="SignUp-tab-btn" onclick="showForm('signup')">
                    Sign Up
                </button>
            </div>

            <!-- SIGN IN -->
            <form id="signin-form" class="auth-form" onsubmit="event.preventDefault();">

                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">

                <label>Password</label>
                <input type="password" placeholder="Enter your password">

                <button type="submit" class="auth-btn" id="signin-btn">
                    <span class="btn-text">Sign In</span>
                    <span class="spinner hidden"></span>
                </button>

            </form>

            <!-- SIGN UP -->
            <form id="signup-form" class="auth-form hidden">

                <label>Full Name</label>
                <input type="text" name="fullName" placeholder="Enter your full name">

                <label>Username</label>
                <input type="text" name="username" placeholder="Enter your username">

                <label>Email Address</label>
                <input type="email" name="email" placeholder="Enter your email">

                <label>Password</label>
                <input type="password" name="password" placeholder="Create a password">

                <label>Confirm Password</label>
                <input type="password" name="confirmPassword" placeholder="Confirm password">

                <button type="submit" class="auth-btn" id="signup-btn">
                    <span class="btn-text">Create Account</span>
                    <span class="spinner hidden"></span>
                </button>

            </form>

        </div>

    </main>

    <div id="toast"></div>
    <script src="/./middlewares/toast.js"></script>
    <script src='../middlewares/signInSwitch.js'></script>
    <script src="../middlewares/auth.js"></script>
    
</body>
</html>
