<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="pages/manageEvents.css">
<link rel="stylesheet" href="/Css/toast.css">
<link rel="icon"  href="./Images/logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<title>Events</title>
</head>
<body>
    <section class="eventManagement">

        <div class="eventHeader">
            <h1>Event Management</h1>
            <p>Create and manage church events</p>
        </div>

        <div class="eventStats">

            <div class="eventStatcard">
                <h3>Total Events</h3>
                <span id="totalEvents">0</span>
            </div>

            <div class="eventStatcard">
                <h3>Active</h3>
                <span id="activeEvents">0</span>
            </div>

            <div class="eventStatcard">
                <h3>Archived</h3>
                <span id="archivedEvents">0</span>
            </div>

        </div>

        <div class="createEventCard">

            <h2>Create Event</h2>

            <form id="eventForm">

                <input
                    type="text"
                    id="title"
                    placeholder="Event Title"
                    required
                >

                <textarea
                    id="description"
                    placeholder="Description"
                    required
                ></textarea>

                <input
                    type="text"
                    placeholder="Date"
                    id="date"
                    required
                >

                <input
                    type="text"
                    placeholder="Time"
                    id="time"
                    required
                >

                <input
                    type="text"
                    id="imageUrl"
                    placeholder="Image URL"
                >

                <button type="submit"> Create Event </button>

            </form>

        </div>

        <div class="eventTableCard">

            <h2>All Events</h2>

            <div class="tableWrapper">
         

                <table>

                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="eventsTable">

                    </tbody>

                </table>

            </div>

        </div>
    </section>

    <script src="/middlewares/outletHelper.js" defer></script>
</body>
</html>
