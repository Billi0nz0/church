<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/pages/manageLive.css">
<link rel="stylesheet" href="/Css/toast.css">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<title>Live Management</title>
</head>

<body>

    <section class="Livesection">

        <div class="liveHeader">
            <h1>Live Management</h1>
            <p>Create, edit and manage livestreams</p>
        </div>

        <div class="LiveStatsGrid">

            <div class="liveStatCard">
                <h3>Status</h3>
                <p id="liveStatus">OFFLINE</p>
            </div>

            <div class="liveStatCard onAirCard offline">
                <h3>Broadcast</h3>

                <div class="onAirWrapper">
                    <span class="dot"></span>
                    <span class="onAirText">OFF AIR</span>
                </div>
            </div>

        </div>

        <!-- CREATE / EDIT FORM -->

        <form id="liveForm">

            <input
                id="liveTitle"
                type="text"
                required
                placeholder="Program Title">

            <textarea
                id="liveDescription"
                required
                placeholder="Description"></textarea>

            <input
                id="liveUrl"
                type="url"
                required
                placeholder="Stream URL">

            <input
                id="thumbnail"
                type="url"
                required
                placeholder="Thumbnail URL">

            <select id="platform">
                <option value="facebook">Facebook</option>
                <option value="youtube">YouTube</option>
            </select>

            <button type="submit">
                Save Stream
            </button>

        </form>

        <!-- TABLE -->

        <section class="streamTableSection">

            <h2>Created Streams</h2>

            <div class="tableWrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Title</th>
                            <th>Platform</th>
                            <th>Status</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>

                    </thead>

                    <tbody id="streamTableBody"></tbody>

                </table>

            </div>

        </section>

    </section>

<script src="/Js/outletHelper.js"></script>

</body>
</html>
