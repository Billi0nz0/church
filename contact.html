<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Css/contact.css">
    <link rel="stylesheet" href="components/header.css">
    <link rel="stylesheet" href="components/footer.css">
    <link rel="icon"  href="./Images/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <title>Contact Us</title>
</head>

<body>
    <div id="header-container"></div>

    <main class="contact-page">
        <div class="contactHeader">

            <h1>Contact Us</h1>
            <p>
                Share your prayer requests or feedback.
                We are here to listen and pray with you.
            </p>

        </div>

        <!-- HERO / FORM SECTION -->
            <section class="contact-hero">

                <section class="contact-options">

                <h2>You Can Also Reach Us Through</h2>

                <div class="contact-grid">

                    <!-- Social -->
                    <div class="contact-card">
                        <h3>Social Media</h3>

                        <div class="icons">
                            <a href="https://www.facebook.com/share/18mCtbcgD5/" target="_blank"><i class="fab fa-facebook-f"></i></a>
                            <a href="https://www.tiktok.com/@globalchampionsmins?_r=1&_t=ZS-96xTaP35Xk0" target="_blank"><i class="fab fa-tiktok"></i></a>
                            <a href="https://www.instagram.com/globalchampions_ministries?igsh=a2h4MWt1eDJuN21r" target="_blank"><i class="fab fa-instagram"></i></a>
                            <a href="https://youtube.com/@globalchampionsministries?si=j1SVu2T7jFEXqz_f" target="_blank"><i class="fab fa-youtube"></i></a>
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="contact-card">
                        <h3>Email</h3>

                        <p>
                            <i class="fas fa-envelope"></i>
                            <a href="mailto:contact@gcm.com">contact@gcm.com</a>
                        </p>
                    </div>

                    <!-- Locations -->
                    <div class="contact-card wide">

                        <h3>Our Locations</h3>

                        <a href="https://www.google.com/maps/place/7+Osinaike+Oluwawemimo+St" target="_blank">
                            <i class="fas fa-map-marker-alt"></i>
                            7 Osinaike Oluwawemimo Crescent, Lagos
                        </a>

                        <a href="https://www.google.com/maps/search/3+saidi+ologunro+street" target="_blank">
                            <i class="fas fa-map-marker-alt"></i>
                            3 Saidi Ologunro Street, Sangotedo, Lagos
                        </a>

                    </div>

                </div>

            </section>

            <div class="contact-form-box">

                <form id="contact-form">

                    <h2>Send a Message</h2>

                    <label>Full Name</label>
                    <input type="text" name="name" required>

                    <label>Email Address</label>
                    <input type="email" name="email" required>

                    <label>Message</label>
                    <textarea name="message" required></textarea>

                    <button type="submit">Send Message</button>

                    <div id="spinner" style="display: none; text-align: center; margin-top: 20px;"> <i class="fas fa-spinner fa-spin"></i> </div>
                    <div style="text-align: center; margin-top: 20px;" id="statusMessage"></div>

                </form>

            </div>

        </section> 

    </main>

    <footer id="footer-container"></footer>
    <script src="JavaScript/nav.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script src="JavaScript/contactform.js"></script>
    <script src="JavaScript/components.js"></script>
</body>
</html>
